name: CI - Celery (Controller + Workers) components
run-name: "CI: Build Rodan-lite celery-related images"
on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'celery/**'
      - '.github/workflows/*workers*'
  pull_request:
    paths:
      - 'celery/**'
  workflow_dispatch:

concurrency:
  group: 'celery-test-build'
  cancel-in-progress: true

jobs:

  # ------- Celery Controller -------
  celery-controller-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v3
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: latest
      - name: Build celery controller
        run: docker compose build celery-controller
  # ------- Celery Python Workers -------
  celery-python-workers-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-compose-action@v1
        with:
          version: latest
      - name: Build Python-related celery workers
        run: docker compose build celery-python-workers
  # ------- Celery GPU Workers -------
  celery-gpu-workers-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Free disk space before Docker build
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/share/dotnet || true
          docker system prune -af --volumes || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "=== Disk usage after cleanup ==="
          df -h
      - uses: docker/setup-compose-action@v1
        with:
          version: latest
      - name: Build GPU-related celery workers
        run: docker compose --profile celery-gpu-workers build
      